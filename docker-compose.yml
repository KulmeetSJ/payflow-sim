# PayFlow Sim, all on one laptop. Kafka: 3 brokers in KRaft combined mode (broker + controller),
# replication factor 3, min.insync.replicas 2, so one broker can be killed without losing data.
#   docker compose up -d --build
#   docker compose up -d --scale payment-processor=3   (consumer-group demo)

x-kafka: &kafka
  image: apache/kafka:4.3.2
  restart: unless-stopped
  mem_limit: 768m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s

x-kafka-env: &kafka-env
  CLUSTER_ID: ol7NbDwCROeRtVblXQt7bA   # base64url UUID (kafka-storage.sh random-uuid)
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

# Shared by both Spring services: OTel agent config + JSON logs.
x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp          # logs go to Loki via the collector, with trace_id attached
  OTEL_METRICS_EXPORTER: none       # metrics are scraped from /actuator/prometheus instead
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # JSON on stdout; trace_id/span_id come from the agent's MDC

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["29093:29093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["29094:29094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-gateway:
    build: { context: ., args: { MODULE: payment-gateway } }
    image: payflow/payment-gateway:local
    restart: unless-stopped
    mem_limit: 512m
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: payment-gateway
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  payment-processor:
    build: { context: ., args: { MODULE: payment-processor } }
    image: payflow/payment-processor:local
    restart: unless-stopped
    mem_limit: 512m
    ports: ["8081-8087:8081"]   # a range, so the service can be scaled
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: payment-processor
      DB_URL: jdbc:postgresql://postgres:5432/payflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      LISTENER_CONCURRENCY: ${LISTENER_CONCURRENCY:-1}   # consumer threads per instance
      ADMIN_ENDPOINTS_ENABLED: "true"   # DLT inspector + fault injection (local demo only)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError   # 7 instances must fit on a laptop
    depends_on:
      postgres: { condition: service_healthy }
      payment-gateway: { condition: service_started }   # gateway creates the topic

  # ---------------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./observability/loki.yaml:/etc/loki/loki.yaml:ro"]
    ports: ["3100:3100"]

  kafka-exporter:   # consumer lag measured from the broker side, so it still works when consumers are down
    image: danielqsj/kafka-exporter:v1.11.0
    restart: unless-stopped
    mem_limit: 64m
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092"]
    depends_on:
      kafka-1: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes: ["./observability/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    mem_limit: 64m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local demo only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payflow.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
