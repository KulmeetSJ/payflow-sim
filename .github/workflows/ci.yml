name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + integration tests against real Kafka and PostgreSQL (failsafe + Testcontainers)
      - name: mvn verify
        run: ./mvnw -B verify
      - name: docker compose config
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-check-only   # only validates the file; nothing starts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: "**/target/*-reports/"
          retention-days: 7

  # SLO rules are code: syntax-checked and unit-tested (the burn-rate alerts must fire, and must not)
  slo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: promtool check + test
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p" -w /p/tests --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /p/prometheus.yml --syntax-only
          docker run --rm -v "$PWD/observability/prometheus:/p" -w /p/tests --entrypoint promtool \
            prom/prometheus:v3.15.1 test rules slo_test.yml

