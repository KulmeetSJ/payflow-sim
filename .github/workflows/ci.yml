name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + integration tests against real Kafka and PostgreSQL (failsafe + Testcontainers)
      - name: mvn verify
        run: ./mvnw -B verify
      - name: docker compose config
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-check-only   # only validates the file; nothing starts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: "**/target/*-reports/"
          retention-days: 7
