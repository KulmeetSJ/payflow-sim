spring:
  application:
    name: payment-processor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD}   # no default: supplied via env, never committed
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-processor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
      properties:
        isolation.level: read_committed
        # Incremental (cooperative) rebalancing: on scale-out only the partitions that move are
        # revoked; everyone else keeps consuming. The default (RangeAssignor, eager) stops the whole group.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: manual           # offset committed by the listener, after the DB transaction
      concurrency: ${LISTENER_CONCURRENCY:1}

payflow:
  topic:
    partitions: 6          # retry topics get the same count as payments.initiated
  retry:
    attempts: 4            # main topic + 3 retry topics
    initial-delay-ms: 1000
    max-delay-ms: 10000
  admin:
    enabled: ${ADMIN_ENDPOINTS_ENABLED:false}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # real buckets, so p95/p99 can be aggregated across instances
