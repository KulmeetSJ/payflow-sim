spring:
  application:
    name: payment-processor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD}   # no default: supplied via env, never committed
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-processor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual           # offset committed by the listener, after the DB transaction
      concurrency: ${LISTENER_CONCURRENCY:1}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
